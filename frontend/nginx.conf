# nginx config for the Praxis web image.
# - Serves the built SPA with history-API fallback.
# - Proxies /api to the API service (same-origin, so no CORS).
# - Does NOT cache the service worker or index.html (so updates roll out).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the service worker or the app entry — always revalidate.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API → the api service (name from docker-compose). Buffering off so the
    # health poll and streaming stay responsive.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoint lives at the API root (not under /api) — proxy it too.
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
